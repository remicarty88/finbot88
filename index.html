<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e131c">
<title>NEON / OLOV — контроль смен</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e131c;--sf:#151c28;--sf2:#1c2535;--ln:#263145;--tx:#e8edf5;--mu:#9ba7bc;--neon:#7c9cff;--olov:#ff8f45;--none:#9ba7bc;--risk:#f2555a;--warn:#f0c040;--on:#3dd68c;color-scheme:dark}
:root[data-theme=light]{--bg:#f2f4f8;--sf:#fff;--sf2:#eef1f6;--ln:#dde2ec;--tx:#141a26;--mu:#566078;--neon:#4263eb;--olov:#e8590c;--none:#566078;--risk:#d92d3a;--warn:#a86a00;--on:#12a05c;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--tx);font:15px/1.55 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.c-NEON{--c:var(--neon)}.c-OLOV{--c:var(--olov)}.c-NONE{--c:var(--none)}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:6px;background:var(--sf)}
.brand{font:600 17px Unbounded,sans-serif;padding:0 10px 18px;letter-spacing:-.01em}
.brand i{font-style:normal;color:var(--neon)}.brand b{color:var(--olov);font-weight:600}
nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;color:var(--mu);font-weight:500}
nav a:hover{color:var(--tx);background:var(--sf2)}
nav a[aria-current=page]{color:var(--tx);background:var(--sf2);box-shadow:inset 3px 0 0 var(--tx)}
.nb{background:var(--risk);color:#fff;font-size:11px;border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;font-size:12px;color:var(--mu);padding:10px}
.side-foot b{display:block;color:var(--tx);font-weight:500}
main{padding:0 clamp(16px,3vw,40px) 64px;min-width:0}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding:18px 0 14px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
h1{margin:0;font:600 clamp(18px,2.2vw,24px) Unbounded,sans-serif;letter-spacing:-.02em}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px}.fld>span{font-size:12px;color:var(--mu)}.dates{display:flex;align-items:center;gap:6px;color:var(--mu)}
.seg{display:inline-flex;background:var(--sf2);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:99px;color:var(--mu);cursor:pointer}
.seg button:hover{color:var(--tx)}
.seg button[aria-pressed=true]{background:var(--tx);color:var(--bg)}
.in{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px 10px}
.btn{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;cursor:pointer}.btn:hover{border-color:var(--mu)}.ri{display:none}
#status{padding:12px 0 0;color:var(--mu);font-size:13px}#status.err{color:var(--risk)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:22px 0 8px}
.st{display:block;text-align:left;padding:16px 18px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;color:var(--tx)}
button.st{cursor:pointer}button.st:hover{border-color:var(--mu)}.st[aria-pressed=true]{border-color:var(--tx);box-shadow:inset 0 0 0 1px var(--tx)}
.st b{display:block;font:500 clamp(28px,3vw,34px)/1.1 Unbounded,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.st span{display:block;margin-top:8px;font-weight:500}.st em{display:block;font-style:normal;color:var(--mu);font-size:13px}
.st.r{border-color:color-mix(in srgb,var(--risk) 45%,var(--ln))}.st.r b{color:var(--risk)}.st.w b{color:var(--warn)}
h2{font:600 16px Unbounded,sans-serif;margin:34px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2 small{font:400 13px Onest,sans-serif;color:var(--mu)}h2 small a:hover{color:var(--tx)}
.tl{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 18px 10px;overflow-x:auto}
.tl-in{min-width:640px}
.tr,.ax{display:grid;grid-template-columns:160px 1fr;align-items:center}
.tr{height:42px}
.tn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}.tn:hover{text-decoration:underline}
.tn small{color:var(--mu);margin-left:6px}
.trk{position:relative;height:100%;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / var(--h) - 1px),var(--ln) 0 calc(100% / var(--h)))}
.sb{position:absolute;top:12px;height:18px;border-radius:99px;background:var(--c);opacity:.92}
.sb.live{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.5}}
.tk.mid{background:var(--warn)}.tk{position:absolute;top:3px;width:4px;height:36px;border-radius:2px;background:var(--risk);box-shadow:0 0 0 2px var(--sf)}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--tx)}
.grp{display:flex;align-items:center;gap:8px;font-weight:600;padding:12px 0 4px;color:var(--c)}
.ax>div{position:relative;height:38px;font-size:12px;color:var(--mu)}.ax span{position:absolute;top:20px;transform:translateX(-50%)}.ax .nw{top:0;z-index:1;color:var(--tx);font-weight:600;background:var(--sf2);padding:1px 8px;border-radius:99px}
.leg{display:flex;gap:20px;font-size:13px;color:var(--mu);padding:8px 0 4px 160px;flex-wrap:wrap}
.leg i{display:inline-block;vertical-align:middle;margin-right:6px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:13px 16px 13px 0;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}th.r,td.r{text-align:right}td:first-child,th:first-child{padding-left:12px}
.sv-high td:first-child{box-shadow:inset 3px 0 0 var(--risk)}.sv-mid td:first-child{box-shadow:inset 3px 0 0 var(--warn)}.sub{display:block;color:var(--mu);font-size:13px}
tbody tr:hover{background:var(--sf2)}tr.lk{cursor:pointer}
td small{color:var(--mu);margin-left:8px}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);font-weight:600;font-size:12px;margin-right:10px;vertical-align:middle}
.cd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}
.pill{font-size:12px;color:var(--mu)}.pill.on{color:var(--on)}
.pill.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--on);margin-right:7px;box-shadow:0 0 0 3px color-mix(in srgb,var(--on) 25%,transparent)}
.tag{font-size:13px;font-weight:500;border-radius:6px;padding:2px 8px;background:var(--sf2)}
.tag.high{background:color-mix(in srgb,var(--risk) 18%,transparent);color:var(--risk)}
.tag.mid{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:36px;align-items:start;margin-top:8px}
.rk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.rk i{grid-column:1/-1;height:6px;border-radius:2px;background:var(--risk);display:block}
.empty{padding:48px 0;text-align:center;color:var(--mu)}
.back{display:inline-block;margin-top:18px;color:var(--mu)}.back:hover{color:var(--tx)}
.ph{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-top:14px}
.ph .av{width:48px;height:48px;font-size:16px;margin-right:14px}
.ph h2{margin:0;font-size:20px}.ph p{margin:2px 0 0;color:var(--mu)}
.sh{display:grid;grid-template-columns:120px 150px 1fr 70px;gap:12px;padding:9px 0;border-bottom:1px solid var(--ln);align-items:center;font-variant-numeric:tabular-nums}
.sh i{display:block;height:6px;border-radius:3px;background:var(--c)}.sh span:last-child{text-align:right;color:var(--mu)}
.set{max-width:660px;margin-top:10px}
.set>div{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--ln)}
.set small{display:block;color:var(--mu)}
.ni{display:flex;align-items:center;gap:10px}
#status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--on);margin-right:8px}#status.err::before{background:var(--risk)}#status:empty::before{display:none}
.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.chip{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sf);border:1px solid var(--ln);border-left:3px solid var(--c);border-radius:12px}.chip:hover{border-color:var(--c)}
.chip .av{margin:0;flex:none}.chip>div{min-width:0;flex:1}.chip b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols{display:flex;gap:10px;align-items:flex-end;min-height:190px;min-width:420px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--mu)}
.col b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.stk{width:100%;max-width:48px;display:flex;flex-direction:column-reverse;gap:2px;border-radius:6px;overflow:hidden;min-height:4px}.stk i{display:block;background:var(--c)}
.set>.tgrow{display:block}.tgb{margin-top:14px}.tgs{margin:0 0 14px;padding-left:20px;color:var(--mu)}.tgs b,.tgs code{color:var(--tx)}
.tgf{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.tgf .in{min-width:240px;flex:1}
.tgl{margin:0 0 14px}.tgl a{color:var(--neon);text-decoration:underline}.tgh{font:600 14px Onest,sans-serif;margin:22px 0 4px}
.tgsub{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln)}.tgsub small{display:inline;margin-left:8px}
.tgm{margin:12px 0 0;color:var(--mu)}.tgm.err{color:var(--risk)}
@media(max-width:860px){
.app{grid-template-columns:1fr}
aside{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px;z-index:9;border:0;border-top:1px solid var(--ln)}
.brand,.side-foot{display:none}nav{display:flex;flex:1;gap:2px}nav a{flex:1;justify-content:center;gap:6px;font-size:12px;padding:10px 4px;text-align:center}
.two{grid-template-columns:1fr}main{padding-bottom:90px}.bar{position:static}.sh{grid-template-columns:90px 1fr 60px}.sh span:nth-child(2){display:none}
.leg{padding-left:0}.ni{flex-direction:column;gap:3px}nav a{position:relative}.nb{position:absolute;top:2px;right:16%}.tr,.ax{grid-template-columns:110px 1fr}}
.tn{background:var(--sf)}
@media(max-width:860px){
aside{padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--sf) 94%,transparent);backdrop-filter:blur(12px)}
nav a{min-height:52px}
.ni{align-items:center;font-size:11px;line-height:1.2}
.lf{display:none}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.tl-in{min-width:560px}
.tn{position:sticky;left:0;z-index:3;padding-left:2px}
.ax>div:first-child{position:sticky;left:0;z-index:3;background:var(--sf)}
.tn small{display:none}
}
@media(min-width:861px){.ls{display:none}}
@media(max-width:640px){
body{font-size:15px}
main{padding-left:14px;padding-right:14px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.in,select.in,input.in{font-size:16px}
.btn,.in{min-height:44px}
.seg button{min-height:38px;padding:7px 14px}
/* шапка и фильтры */
.bar{padding:14px 0 10px;gap:10px}
.bar .tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;width:100%;align-items:center}
.bar .tools>.fld:nth-child(1),.bar .tools>.fld:nth-child(2){grid-column:1/-1}
.bar .fld>span{display:none}
.bar .seg{display:flex}.bar .seg button{flex:1}
.bar #presets{overflow-x:auto;scrollbar-width:none}.bar #presets::-webkit-scrollbar{display:none}
.bar #presets button{flex:none}
.dates{width:100%}.dates .in{flex:1;min-width:0}
#reload{width:44px;padding:0;display:grid;place-items:center}
#reload .rl{display:none}#reload .ri{display:block;font-size:20px;line-height:1}
/* карточки показателей */
.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 6px}
.stats>.st:last-child:nth-child(odd){grid-column:1/-1}
.st{padding:14px}.st b{font-size:26px}.st span{margin-top:6px}
h2{margin:26px 0 10px;flex-wrap:wrap;font-size:15px}
.tl{padding:10px 12px 6px;border-radius:14px}
.leg{gap:8px 16px;font-size:12px}
/* таблицы -> карточки */
.wrap{overflow:visible}
table,tbody,tr,td{display:block}
thead{display:none}
tbody tr{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:6px 14px;margin-bottom:10px}
tbody tr:hover{background:var(--sf)}
td,td:first-child{padding:5px 0;border:0;white-space:normal;display:flex;justify-content:space-between;align-items:baseline;gap:14px;text-align:right}
td::before{content:attr(data-k);color:var(--mu);font-size:13px;text-align:left;flex:none}
td[data-k=""]{justify-content:flex-start;text-align:left;padding:8px 0}td[data-k=""]::before{display:none}
td.nil{display:none}
td .v{min-width:0}
td small{margin-left:6px}
.sv-high td:first-child,.sv-mid td:first-child{box-shadow:none}
tr.sv-high{box-shadow:inset 3px 0 0 var(--risk)}tr.sv-mid{box-shadow:inset 3px 0 0 var(--warn)}
.sub{font-size:12px}
.chip{padding:12px}
.two{gap:8px}
/* профиль и настройки */
.ph .av{width:42px;height:42px;font-size:14px;margin-right:12px}
.ph label{width:100%}.ph select{width:100%;margin-top:4px}
.sh{grid-template-columns:84px 1fr 62px;gap:10px}
.set>div{flex-wrap:wrap;gap:12px}
.tgf .in{min-width:0;width:100%}.tgf .btn{flex:1}
.tgsub{flex-wrap:wrap}
#view .tools{gap:10px}
#view .tools>.in{flex:1;width:100%}
#view .tools .fld{flex:1 1 140px}
#view .tools .fld .in{width:100%}
#csv{margin-left:0!important;width:100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><i>NEON</i> / <b>OLOV</b></div>
  <nav id="nav" aria-label="Разделы"></nav>
  <div class="side-foot"><b>Источник данных</b><span id="src">iiko</span></div>
</aside>
<main>
  <div class="bar">
    <h1 id="ttl"></h1>
    <div class="tools">
      <div class="fld"><span>Концепция</span><div class="seg" role="group" aria-label="Концепция">
        <button data-s="ALL">Все</button><button data-s="NEON">NEON</button><button data-s="OLOV">OLOV</button>
      </div></div>
      <div class="fld"><span>Период</span><div class="dates"><input class="in" type="date" id="from" aria-label="С даты">–<input class="in" type="date" id="to" aria-label="По дату"></div></div>
      <div class="fld"><span>Быстрый выбор</span><div class="seg" id="presets" role="group" aria-label="Период">
        <button data-p="0">Сегодня</button><button data-p="1">Вчера</button><button data-p="7">7 дней</button><button data-p="30">30 дней</button>
      </div></div>
      <button class="btn" id="reload" aria-label="Обновить"><span class="rl">Обновить</span><span class="ri" aria-hidden="true">↻</span></button>
    </div>
  </div>
  <div id="status"></div>
  <div id="view"></div>
</main>
</div>

<script>
const NAMES={NEON:'NEON',OLOV:'OLOV',NONE:'Без концепции'};
const ROUTES=[['/','Обзор','Обзор'],['/staff','Сотрудники','Люди'],['/danger','Контроль операций','Операции'],['/settings','Настройки','Настройки']];
const IC={'/':'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>','/staff':'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 010 7M18.5 14.5c2 .7 3 2.6 3 5.5"/>','/danger':'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>','/settings':'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
const TITLES={overview:'Обзор',staff:'Сотрудники',danger:'Контроль операций',settings:'Настройки'};
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
let S={staff:[],danger:[],demo:false,scope:ls('scope')||'ALL',sev:'ALL',ft:'ALL',q:'',over:{}};
try{S.over=JSON.parse(ls('concepts')||'{}')}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const guess=t=>/olov|олов/i.test(t||'')?'OLOV':/neon|неон/i.test(t||'')?'NEON':null;
const pad=n=>String(n).padStart(2,'0');
const tm=d=>d?pad(d.getHours())+':'+pad(d.getMinutes()):'—';
const dt=d=>{const k=iso(d);return k===iso(new Date())?'Сегодня':k===iso(new Date(Date.now()-864e5))?'Вчера':d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'})};
const hrs=ms=>Math.floor(ms/36e5)+'ч '+pad(Math.round(ms%36e5/6e4))+'м';
const num=n=>Math.round(n).toLocaleString('ru-RU');
const period=()=>{const f=$('#from').value,t=$('#to').value,v=x=>x.slice(8)+'.'+x.slice(5,7);return f===t?v(f):v(f)+' – '+v(t)};
const money=n=>Math.round(n).toLocaleString('ru-RU')+' сум';
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ini=n=>String(n).split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function conceptOf(p){
  if(S.over[p.id])return S.over[p.id];
  const c={};p.shifts.forEach(s=>{const g=guess(s.dept);if(g)c[g]=(c[g]||0)+1});
  return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||'NONE';
}
function prep(p){
  const shifts=p.shifts.map(s=>({from:new Date(s.from),to:s.to?new Date(s.to):null,dept:s.dept})).sort((a,b)=>b.from-a.from);
  const total=shifts.reduce((t,s)=>t+((s.to||new Date())-s.from),0);
  return {...p,shifts,total,open:shifts.find(s=>!s.to),concept:conceptOf(p)};
}
function dangerConcept(o){const p=S.staff.find(p=>p.name===o.cashier);return p?conceptOf(p):(guess(o.dept)||'NONE')}
const inScope=c=>S.scope==='ALL'||c===S.scope;
const people=()=>S.staff.map(prep).filter(p=>inScope(p.concept));
const ops=()=>S.danger.map(o=>({...o,c:dangerConcept(o)})).filter(o=>inScope(o.c));
const who=o=>{const p=S.staff.find(p=>p.name===o.cashier);
  return `<span class="c-${o.c}"><i class="cd"></i>${p?`<a href="/staff/${encodeURIComponent(p.id)}" data-l>${esc(o.cashier)}</a>`:esc(o.cashier)}</span>`};

function opsTable(l){
  if(!l.length)return '<div class="empty">Тревожных операций за период нет.</div>';
  return `<div class="wrap"><table><thead><tr><th>Когда</th><th>Что произошло</th><th>Сотрудник</th><th>Заказ</th><th>Блюдо</th><th class="r">Сумма, сум</th><th class="r">Скидка, сум</th><th>Подтвердил</th></tr></thead><tbody>
  ${l.map(o=>{const d=new Date(o.time);return `<tr class="sv-${o.severity}"><td>${dt(d)}<span class="sub">${tm(d)}</span></td><td><span class="tag ${o.severity}">${esc(o.type)}</span></td><td>${who(o)}</td>
  <td>№${esc(o.order)}${o.table?`<span class="sub">стол ${esc(o.table)}</span>`:''}</td><td>${o.dish?esc(o.dish)+(o.qty>1?' ×'+o.qty:''):'—'}</td><td class="r">${num(o.sum)}</td>
  <td class="r">${o.discount>0?num(o.discount)+(o.discountName?`<span class="sub">${esc(o.discountName)}</span>`:''):'—'}</td><td>${esc(o.auth)||'—'}</td></tr>`}).join('')}</tbody></table></div>`;
}

function timeline(P,O){
  const H=20,toEnd=new Date($('#to').value+'T00:00').getTime()+864e5;
  const end=Math.ceil(Math.min(Date.now()+36e5,toEnd)/36e5)*36e5,start=end-H*36e5;
  const x=t=>(Math.min(Math.max(t,start),end)-start)/(end-start)*100;
  const rows=P.filter(p=>p.shifts.some(s=>+(s.to||end)>start&&+s.from<end)).sort((a,b)=>a.concept.localeCompare(b.concept)||a.name.localeCompare(b.name,'ru'));
  if(!rows.length)return '<div class="empty">В этом окне нет смен. Выберите период, который включает сегодня.</div>';
  const ax=Array.from({length:H/2+1},(_,i)=>`<span style="left:${i*2/H*100}%">${pad(new Date(start+i*2*36e5).getHours())}:00</span>`).join('')+(Date.now()<=end?`<span class="nw" style="left:${x(Date.now())}%">сейчас ${tm(new Date())}</span>`:'');
  let g='';
  const mk='position:static;display:inline-block;margin-right:6px;vertical-align:middle;';
  return `<div class="tl"><div class="tl-in" style="--h:${H}"><div class="ax"><div></div><div>${ax}</div></div>
  ${rows.map(p=>{const h=p.concept!==g?(g=p.concept,`<div class="grp c-${g}"><i class="cd"></i>${NAMES[g]}</div>`):'';return h+`<div class="tr c-${p.concept}"><a class="tn" href="/staff/${encodeURIComponent(p.id)}" data-l>${esc(p.name)}<small>${esc(p.role)}</small></a><div class="trk">
    ${p.shifts.filter(s=>+(s.to||end)>start&&+s.from<end).map(s=>{const a=x(+s.from),b=x(+(s.to||Date.now()));return `<i class="sb${s.to?'':' live'}" style="left:${a}%;width:${Math.max(b-a,.6)}%" title="Смена ${tm(s.from)} — ${s.to?tm(s.to)+' ('+hrs(s.to-s.from)+')':'идёт'}"></i>`}).join('')}
    ${O.filter(o=>o.cashier===p.name&&o.severity!=='low'&&+new Date(o.time)>=start&&+new Date(o.time)<=end).map(o=>`<i class="tk ${o.severity}" style="left:${x(+new Date(o.time))}%" title="${tm(new Date(o.time))} — ${esc(o.type)}"></i>`).join('')}
    ${Date.now()<=end?`<i class="now" style="left:${x(Date.now())}%"></i>`:''}</div></div>`}).join('')}
  <div class="leg"><span><i class="sb" style="${mk}width:24px;height:8px;background:var(--mu)"></i>смена (цвет — концепция)</span><span><i class="tk" style="${mk}width:4px;height:14px"></i>высокий риск</span><span><i class="tk mid" style="${mk}width:4px;height:14px"></i>средний риск</span></div></div></div>`;
}

function liveBoard(on,O){
  const hi={};O.forEach(o=>{if(o.severity==='high')hi[o.cashier]=(hi[o.cashier]||0)+1});
  const list=[...on].sort((a,b)=>a.concept.localeCompare(b.concept)||a.name.localeCompare(b.name,'ru'));
  return `<h2>Сейчас на смене<small>${on.length?on.length+' чел.':''}</small></h2>`+(list.length?`<div class="live">${list.map(p=>`<a class="chip c-${p.concept}" href="/staff/${encodeURIComponent(p.id)}" data-l><span class="av">${esc(ini(p.name))}</span><div><b>${esc(p.name)}</b><span class="sub">${esc(p.role)||NAMES[p.concept]}, с ${tm(p.open.from)} (${hrs(new Date()-p.open.from)})</span></div>${hi[p.name]?`<span class="tag high" title="Операций высокого риска">${hi[p.name]}</span>`:''}</a>`).join('')}</div>`:'<div class="empty">Сейчас никто не открыл смену.</div>');
}
function hoursChart(P){
  const m={};
  P.forEach(p=>p.shifts.forEach(s=>{const k=iso(s.from);(m[k]=m[k]||{NEON:0,OLOV:0,NONE:0})[p.concept]+=((s.to||new Date())-s.from)/36e5}));
  const ks=Object.keys(m).sort().slice(-14);if(!ks.length)return '';
  const tot=k=>m[k].NEON+m[k].OLOV+m[k].NONE,mx=Math.max(...ks.map(tot),1);
  return `<h2>Часы по дням<small><span class="c-NEON"><i class="cd"></i>NEON</span> &nbsp; <span class="c-OLOV"><i class="cd"></i>OLOV</span></small></h2><div class="tl"><div class="cols">${ks.map(k=>{const v=m[k],d=new Date(k+'T12:00');
    return `<div class="col" title="${dt(d)}: NEON ${Math.round(v.NEON)} ч, OLOV ${Math.round(v.OLOV)} ч"><b>${Math.round(tot(k))}</b><div class="stk" style="height:${Math.max(4,tot(k)/mx*130)}px">${['NEON','OLOV','NONE'].map(c=>v[c]?`<i class="c-${c}" style="flex:${v[c]}"></i>`:'').join('')}</div><span>${d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</span></div>`}).join('')}</div></div>`;
}
function exportCsv(){
  const L={high:'высокий',mid:'средний',low:'скидки'},q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Время','Тип','Уровень','Сотрудник','Заказ','Стол','Блюдо','Кол-во','Сумма','Скидка','Подтвердил'],...(S.view||[]).map(o=>[o.time,o.type,L[o.severity]||'',o.cashier,o.order,o.table,o.dish,o.qty,o.sum,o.discount,o.auth])];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n')],{type:'text/csv'}));a.download='operations-'+$('#from').value+'.csv';a.click();
}
function pOverview(){
  const P=people(),O=ops(),on=P.filter(p=>p.open),hi=O.filter(o=>o.severity==='high');
  const cnt=k=>on.filter(p=>p.concept===k).length,total=P.reduce((t,p)=>t+p.total,0),h=Math.round(total/36e5);
  return `<div class="stats">
    <div class="st"><b>${on.length}</b><span>На смене сейчас</span><em>NEON ${cnt('NEON')}, OLOV ${cnt('OLOV')}</em></div>
    <div class="st"><b>${P.length}</b><span>Сотрудников</span><em>со сменами за ${period()}</em></div>
    <div class="st"><b>${h}</b><span>Часов отработано</span><em>${P.length?'в среднем '+Math.round(h/P.length)+' ч на человека':'за '+period()}</em></div>
    <button class="st r" data-go="/danger"><b>${hi.length}</b><span>Высокий риск</span><em>операции для проверки, открыть список</em></button></div>
  ${liveBoard(on,O)}
  <h2>Смены и тревожные операции<small>последние 20 часов</small></h2>${timeline(P,O)}${hoursChart(P)}
  <h2>Последние тревожные операции<small><a href="/danger" data-l>Все операции</a></small></h2>${opsTable(O.filter(o=>o.severity!=='low').slice(0,6))}`;
}

  ${P.length?`<div class="wrap"><table class="stf"><thead><tr><th>Сотрудник</th><th>Концепция</th><th>Статус</th><th class="r">Смен</th><th class="r">Часов</th><th class="r">Тревожных операций</th></tr></thead><tbody>
  ${P.map(p=>{const n=cnt[p.name]||0;return `<tr class="lk c-${p.concept}" data-go="/staff/${encodeURIComponent(p.id)}"><td><span class="av">${esc(ini(p.name))}</span>${esc(p.name)}<small>${esc(p.role)}</small></td>
  <td><i class="cd"></i>${NAMES[p.concept]}</td><td>${p.open?`<span class="pill on">на смене с ${tm(p.open.from)}</span>`:`<span class="pill">последняя смена: ${dt(p.shifts[0].from)}</span>`}</td>
  <td class="r">${p.shifts.length}</td><td class="r">${hrs(p.total)}</td><td class="r">${n?`<span class="tag high">${n}</span>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Нет сотрудников со сменами за этот период.</div>'}`;
}

  const p0=S.staff.find(p=>p.id===id);

  const p=prep(p0),O=S.danger.filter(o=>o.cashier===p.name).map(o=>({...o,c:p.concept}));

    <label>Концепция <select class="in" data-assign="${esc(p.id)}">${['NEON','OLOV','NONE'].map(k=>`<option value="${k}" ${p.concept===k?'selected':''}>${NAMES[k]}</option>`).join('')}</select></label></div>
  <div class="stats"><div class="st"><b>${p.shifts.length}</b><span>Смен</span></div><div class="st"><b>${Math.round(p.total/36e5)}</b><span>Часов</span></div>
    <div class="st ${O.length?'r':''}"><b>${O.length}</b><span>Операций под вопросом</span></div></div>
  <h2>Смены<small>полоса — длительность, во всю ширину 14 часов</small></h2>${p.shifts.map(s=>`<div class="sh"><span>${dt(s.from)}</span><span>${tm(s.from)} — ${s.to?tm(s.to):'идёт'}</span><i style="width:${Math.min(100,((s.to||new Date())-s.from)/(14*36e5)*100).toFixed(1)}%"></i><span>${s.to?hrs(s.to-s.from):'идёт'}</span></div>`).join('')}
  <h2>Операции<small>с высоким, средним риском и скидками</small></h2>${opsTable(O)}</div>`;
}

function pDanger(){
  const all=ops(),types=[...new Set(all.map(o=>o.type))],lt=all.filter(o=>S.ft==='ALL'||o.type===S.ft);
  const l=lt.filter(o=>S.sev==='ALL'||o.severity===S.sev);S.view=l;
  const by={};l.forEach(o=>{if(o.severity!=='low')by[o.cashier]=(by[o.cashier]||0)+1});
  const rk=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=rk[0]?rk[0][1]:1,n=s=>lt.filter(o=>o.severity===s).length;
  const card=(k,cls,t,h)=>`<button class="st ${cls}" data-sev="${k}" aria-pressed="${S.sev===k}"><b>${n(k)}</b><span>${t}</span><em>${h}</em></button>`;
  return `<div class="tools" style="margin-top:22px"><label class="fld"><span>Уровень риска</span><select class="in" id="fs"><option value="ALL">Все уровни</option><option value="high">Высокий риск</option><option value="mid">Средний риск</option><option value="low">Скидки и прочее</option></select></label>
    <label class="fld"><span>Тип операции</span><select class="in" id="ft"><option value="ALL">Все типы</option>${types.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><button class="btn" id="csv" style="margin-left:auto">Скачать CSV</button></div>
  <div class="stats">${card('high','r','Высокий риск','проверить в первую очередь')}${card('mid','w','Средний риск','стоит просмотреть')}${card('low','','Скидки и прочее','обычные операции')}</div>
  <div class="two"><div>${opsTable(l)}</div><div><h2 style="margin-top:0">Кто чаще всего<small>высокий и средний риск</small></h2>
  ${rk.map(([k,v])=>`<div class="rk"><span>${esc(k)}</span><b>${v}</b><i style="width:${v/mx*100}%"></i></div>`).join('')||'<div class="empty">Нет данных</div>'}</div></div>`;
}

const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
async function loadTg(){S.tgl=1;try{S.tg=await api('GET','/api/telegram')}catch(e){S.tg=null}S.tgl=0;if(route()[0]==='settings')render()}
async function tgDo(m,u,b,ok){try{S.tg=await api(m,u,b);S.tgm=ok?{t:ok}:null}catch(e){S.tgm={t:e.message,e:1}}render()}
function tgBlock(){
  const t=S.tg,m=S.tgm?`<p class="tgm${S.tgm.e?' err':''}">${esc(S.tgm.t)}</p>`:'';
  const head='<span>Telegram-уведомления<small>Опасные операции приходят в бота всем, кто нажал Start</small></span>';

  if(t===null)return head+'<div class="tgb"><p class="tgm err">Сервер не отвечает. Проверьте, что server.js запущен и обновлён до новой версии.</p><button class="btn" id="tgre">Повторить</button></div>';
  if(!t.connected)return head+`<div class="tgb"><ol class="tgs"><li>В Telegram откройте <b>@BotFather</b> и отправьте <code>/newbot</code>.</li><li>Скопируйте токен бота и вставьте сюда.</li><li>Откройте своего бота и нажмите <b>Start</b>: чат указывать не нужно.</li></ol>
    <div class="tgf"><input class="in" id="tgtok" type="password" autocomplete="off" placeholder="123456789:AA…" aria-label="Токен бота"><button class="btn" id="tgon">Подключить</button></div>${m}</div>`;
  const link='https://t.me/'+t.bot.username;
  return head+`<div class="tgb"><p class="tgl">Бот <b>${esc(t.bot.name)}</b>: <a href="${link}" target="_blank" rel="noopener">t.me/${esc(t.bot.username)}</a> <button class="btn" id="tgcp" data-link="${link}">Копировать ссылку</button></p>
  <div class="tgf"><label class="fld"><span>Что отправлять</span><select class="in" id="tgsev"><option value="high">Только высокий риск</option><option value="mid">Высокий и средний риск</option></select></label><button class="btn" id="tgtest">Отправить тест</button><button class="btn" id="tgoff">Отключить бота</button></div>
  <h3 class="tgh">Подписчики: ${t.subs.length}</h3>
  ${t.subs.length?t.subs.map(x=>`<div class="tgsub"><span>${esc(x.name||'Без имени')}${x.username?`<small>@${esc(x.username)}</small>`:''}</span><button class="btn" data-tgdel="${esc(x.id)}">Убрать</button></div>`).join(''):'<p class="tgm">Пока никого. Отправьте ссылку на бота тем, кто должен получать уведомления: им достаточно нажать Start.</p>'}${m}</div>`;
}
function pSettings(){
  const th=document.documentElement.dataset.theme;
  return `<div class="set">
  <div><span>Тема<small>Тёмная удобнее вечером в зале</small></span><div class="seg"><button data-th="dark" aria-pressed="${th==='dark'}">Тёмная</button><button data-th="light" aria-pressed="${th==='light'}">Светлая</button></div></div>
  <div><span>Концепции сотрудников<small>Назначено вручную: ${Object.keys(S.over).length}</small></span><button class="btn" id="rc">Сбросить</button></div>
  <div><span>Демо-данные<small>Показать интерфейс без подключения к iiko</small></span><button class="btn" id="dm">${S.demo?'Вернуть данные iiko':'Включить'}</button></div>
  <div class="tgrow">${tgBlock()}</div></div>`;
}

function route(){
  const p=location.pathname.replace(/\/+$/,'')||'/',m=p.match(/^\/staff\/(.+)$/);
  if(m)return ['profile',decodeURIComponent(m[1])];
  return [({'/staff':'staff','/danger':'danger','/settings':'settings'})[p]||'overview'];
}
function render(){
  const [r,id]=route(),hi=S.danger.filter(o=>o.severity==='high').length;
  $('#nav').innerHTML=ROUTES.map(([h,t,sh])=>{
    const cur=h==='/'?r==='overview':h==='/staff'?(r==='staff'||r==='profile'):h==='/danger'?r==='danger':r==='settings';
    return `<a href="${h}" data-l ${cur?'aria-current="page"':''}><span class="ni"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[h]}</svg><span class="lf">${t}</span><span class="ls">${sh}</span></span>${h==='/danger'&&hi?`<span class="nb">${hi}</span>`:''}</a>`}).join('');
  document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===S.scope));
  const pages={overview:pOverview,staff:pStaff,profile:()=>pProfile(id),danger:pDanger,settings:pSettings};
  $('#view').innerHTML=pages[r]();
  const pr=r==='profile'?S.staff.find(p=>p.id===id):null;
  $('#ttl').textContent=r==='profile'?(pr?pr.name:'Сотрудник'):TITLES[r];
  document.title=$('#ttl').textContent+' — NEON / OLOV';
  $('#src').textContent=S.demo?'демо-данные':'iiko';
  if(r==='danger'){$('#fs').value=S.sev;$('#ft').value=S.ft}
  cardify();
  if(r==='settings'){if(S.tg===undefined&&!S.tgl)loadTg();if(S.tg&&S.tg.connected)$('#tgsev').value=S.tg.severity}
}
function cardify(){
  document.querySelectorAll('#view table').forEach(t=>{
    const h=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim()),stf=t.classList.contains('stf');
    t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((td,i)=>{
      td.dataset.k=stf&&i===0?'':(h[i]||'');
      if(td.textContent.trim()==='—')td.classList.add('nil');
      td.innerHTML='<div class="v">'+td.innerHTML+'</div>';
    }));
  });
}
function go(h){S.tgm=null;history.pushState(null,'',h);render();scrollTo(0,0)}
window.addEventListener('popstate',render);

function setStatus(t,err){const e=$('#status');e.textContent=t;e.className=err?'err':''}
async function load(){
  S.demo=false;setStatus('Загружаю данные из iiko…');
  const from=$('#from').value,last=$('#to').value;
  if(!from||!last||from>last){setStatus('Выберите период: дата «с» не может быть позже даты «по».',true);return}
  const to=new Date(new Date(last).getTime()+864e5).toISOString().slice(0,10);
  const get=async u=>{const r=await fetch(`${u}?from=${from}&to=${to}`);const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j};
  try{
    S.staff=await get('/api/staff');
    try{const j=await get('/api/danger');S.danger=j.ops;S.note=j.note}
    catch(e){S.danger=[];setStatus('Сотрудники загружены, но операции не получены: '+e.message,true);render();return}
    setStatus('Данные iiko, обновлено '+tm(new Date())+(S.note?'. '+S.note:''),!!S.note);
  }catch(e){setStatus('Не удалось получить данные: '+e.message+'. Проверьте, что server.js запущен.',true);S.staff=[];S.danger=[]}
  render();
}
function demo(){
  const names=[['Азиз Каримов','Официант'],['Дильноза Рашидова','Бармен'],['Жасур Тошматов','Повар'],['Нигора Юсупова','Администратор'],['Бекзод Алиев','Официант'],['Мадина Хасанова','Хостес'],['Рустам Саидов','Кассир'],['Лола Эргашева','Официант'],['Тимур Назаров','Бармен'],['Сардор Умаров','Повар']];
  const depts=['NEON Ташкент','OLOV Ташкент'];let r=7;const rnd=()=>(r=r*16807%2147483647)/2147483647;
  S.staff=names.map((n,i)=>{const dept=i===9?'Главный офис':depts[i%2],shifts=[];
    for(let d=0;d<10;d++){if(rnd()<.35)continue;const f=new Date();f.setDate(f.getDate()-d);f.setHours(13+Math.floor(rnd()*4),Math.floor(rnd()*60),0,0);
      const t=new Date(f.getTime()+(7+rnd()*5)*36e5);shifts.push({from:f.toISOString(),to:(d===0&&i<3)?null:t.toISOString(),dept})}
    return {id:'d'+i,name:n[0],role:n[1],shifts:shifts.length?shifts:[{from:new Date(Date.now()-864e5).toISOString(),to:new Date().toISOString(),dept}]}});
  const types=[['Удалённый заказ','high'],['Удаление со списанием','high'],['Сторно','high'],['Скидка от 30%','mid']];
  S.danger=Array.from({length:14},(_,i)=>{const p=names[Math.floor(rnd()*names.length)],t=types[Math.floor(rnd()*4)],sum=(50+Math.floor(rnd()*400))*1000;
    return {time:new Date(Date.now()-rnd()*10*864e5).toISOString(),order:1000+i*7,table:String(1+Math.floor(rnd()*20)),dish:['Лимонад','Бургер','Кофе','Паста'][Math.floor(rnd()*4)],qty:1,cashier:p[0],auth:'Администратор',dept:'',sum,discount:t[1]==='mid'?sum*.35:0,type:t[0],severity:t[1]}})
    .sort((a,b)=>b.time.localeCompare(a.time));
  S.demo=true;setStatus('Показаны демо-данные, не из iiko');render();
}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-l]');if(a&&!e.metaKey&&!e.ctrlKey){e.preventDefault();go(a.getAttribute('href'));return}
  const t=e.target.closest('[data-go]');if(t){go(t.dataset.go);return}
  const v=e.target.closest('[data-sev]');if(v){S.sev=S.sev===v.dataset.sev?'ALL':v.dataset.sev;render();return}
  const s=e.target.closest('[data-s]');if(s){S.scope=s.dataset.s;ls('scope',S.scope);render();return}
  const th=e.target.closest('[data-th]');if(th){setTheme(th.dataset.th);render();return}
  if(e.target.id==='tgre'){S.tg=undefined;render();return}
  if(e.target.id==='tgon'){const v=$('#tgtok').value.trim();if(!v){S.tgm={t:'Вставьте токен от @BotFather.',e:1};render();return}tgDo('POST','/api/telegram',{token:v},'Бот подключён. Откройте его в Telegram и нажмите Start.');return}
  if(e.target.id==='tgtest'){tgDo('POST','/api/telegram/test',{},'Тест отправлен всем подписчикам.');return}
  if(e.target.id==='tgoff'){if(confirm('Отключить бота? Список подписчиков будет очищен.'))tgDo('DELETE','/api/telegram',null,'Бот отключён.');return}
  if(e.target.id==='tgcp'){if(navigator.clipboard)navigator.clipboard.writeText(e.target.dataset.link);e.target.textContent='Скопировано';return}
  const d=e.target.closest('[data-tgdel]');if(d){tgDo('DELETE','/api/telegram/subs/'+encodeURIComponent(d.dataset.tgdel),null,'Подписчик удалён.');return}
  if(e.target.id==='csv'){exportCsv();return}
  if(e.target.id==='rc'){S.over={};ls('concepts','{}');render()}
  if(e.target.id==='dm'){S.demo?load():demo()}
});
document.addEventListener('change',e=>{
  const a=e.target.dataset.assign;
  if(a){S.over[a]=e.target.value;ls('concepts',JSON.stringify(S.over));render()}
  else if(e.target.id==='tgsev')tgDo('POST','/api/telegram/severity',{severity:e.target.value},'Сохранено.')
  else if(e.target.id==='fs'){S.sev=e.target.value;render()}
  else if(e.target.id==='ft'){S.ft=e.target.value;render()}
  else if(e.target.id==='from'||e.target.id==='to')S.demo?demo():load();
});
document.addEventListener('input',e=>{
  if(e.target.id!=='q')return;S.q=e.target.value;render();
  const i=$('#q');i.focus();i.setSelectionRange(i.value.length,i.value.length);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='tgtok')$('#tgon').click()});
setInterval(()=>{if(route()[0]==='settings'&&S.tg&&S.tg.connected&&!S.tgl)loadTg()},10000);
$('#reload').onclick=()=>S.demo?demo():load();
$('#to').value=iso(new Date());$('#from').value=iso(new Date(Date.now()-13*864e5));
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
  const p=+b.dataset.p,t=new Date(),f=new Date();
  if(p===1){t.setDate(t.getDate()-1);f.setDate(f.getDate()-1)}else if(p>1)f.setDate(f.getDate()-(p-1));
  $('#from').value=iso(f);$('#to').value=iso(t);S.demo?demo():load()});
const root=document.documentElement;
function setTheme(t){root.dataset.theme=t;ls('theme',t);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#f2f4f8':'#0e131c'}
setTheme(ls('theme')||'dark');
render();load();
</script>
</body>
</html>
