<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>NEON / OLOV — контроль смен</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e131c;--sf:#151c28;--sf2:#1c2535;--ln:#263145;--tx:#e8edf5;--mu:#9ba7bc;--neon:#7c9cff;--olov:#ff8f45;--none:#9ba7bc;--risk:#f2555a;--warn:#f0c040;--on:#3dd68c;color-scheme:dark}
:root[data-theme=light]{--bg:#f2f4f8;--sf:#fff;--sf2:#eef1f6;--ln:#dde2ec;--tx:#141a26;--mu:#566078;--neon:#4263eb;--olov:#e8590c;--none:#566078;--risk:#d92d3a;--warn:#a86a00;--on:#12a05c;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--tx);font:15px/1.55 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit;touch-action:manipulation}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:6px;background:var(--sf)}

.brand i{font-style:normal;color:var(--neon)}.brand b{color:var(--olov);font-weight:600}
nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;color:var(--mu);font-weight:500}
nav a:hover{color:var(--tx);background:var(--sf2)}
nav a[aria-current=page]{color:var(--tx);background:var(--sf2);box-shadow:inset 3px 0 0 var(--tx)}
.nb{background:var(--risk);color:#fff;font-size:11px;border-radius:99px;padding:0 7px;min-width:20px;text-align:center}

main{padding:0 clamp(16px,3vw,40px) 64px;min-width:0}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding:18px 0 14px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}

.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}

.seg{display:inline-flex;background:var(--sf2);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:99px;color:var(--mu);cursor:pointer}
.seg button:hover{color:var(--tx)}

.in{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px 10px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:22px 0 8px}
.st{display:block;text-align:left;padding:16px 18px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;color:var(--tx)}
button.st{cursor:pointer}button.st:hover{border-color:var(--mu)}.st[aria-pressed=true]{border-color:var(--tx);box-shadow:inset 0 0 0 1px var(--tx)}
.st b{display:block;font:500 clamp(28px,3vw,34px)/1.1 Unbounded,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.st span{display:block;margin-top:8px;font-weight:500}.st em{display:block;font-style:normal;color:var(--mu);font-size:13px}
.st.r{border-color:color-mix(in srgb,var(--risk) 45%,var(--ln))}.st.r b{color:var(--risk)}.st.w b{color:var(--warn)}

h2 small{font:400 13px Onest,sans-serif;color:var(--mu)}h2 small a:hover{color:var(--tx)}
.tl{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 18px 10px;overflow-x:auto}
.tl-in{min-width:640px}
.tr,.ax{display:grid;grid-template-columns:160px 1fr;align-items:center}
.tr{height:42px}
.tn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}.tn:hover{text-decoration:underline}
.tn small{color:var(--mu);margin-left:6px}
.trk{position:relative;height:100%;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / var(--h) - 1px),var(--ln) 0 calc(100% / var(--h)))}
.sb{position:absolute;top:12px;height:18px;border-radius:99px;background:var(--c);opacity:.92}
.sb.live{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.5}}
.tk.mid{background:var(--warn)}.tk{position:absolute;top:3px;width:4px;height:36px;border-radius:2px;background:var(--risk);box-shadow:0 0 0 2px var(--sf)}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--tx)}
.grp{display:flex;align-items:center;gap:8px;font-weight:600;padding:12px 0 4px;color:var(--c)}
.ax>div{position:relative;height:38px;font-size:12px;color:var(--mu)}.ax span{position:absolute;top:20px;transform:translateX(-50%)}.ax .nw{top:0;z-index:1;color:var(--tx);font-weight:600;background:var(--sf2);padding:1px 8px;border-radius:99px}
.leg{display:flex;gap:20px;font-size:13px;color:var(--mu);padding:8px 0 4px 160px;flex-wrap:wrap}
.leg i{display:inline-block;vertical-align:middle;margin-right:6px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:13px 16px 13px 0;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}th.r,td.r{text-align:right}td:first-child,th:first-child{padding-left:12px}
.sv-high td:first-child{box-shadow:inset 3px 0 0 var(--risk)}.sv-mid td:first-child{box-shadow:inset 3px 0 0 var(--warn)}.sub{display:block;color:var(--mu);font-size:13px}
tbody tr:hover{background:var(--sf2)}tr.lk{cursor:pointer}
td small{color:var(--mu);margin-left:8px}

.cd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}
.pill{font-size:12px;color:var(--mu)}.pill.on{color:var(--on)}
.pill.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--on);margin-right:7px;box-shadow:0 0 0 3px color-mix(in srgb,var(--on) 25%,transparent)}
.tag{font-size:13px;font-weight:500;border-radius:6px;padding:2px 8px;background:var(--sf2)}
.tag.high{background:color-mix(in srgb,var(--risk) 18%,transparent);color:var(--risk)}
.tag.mid{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:36px;align-items:start;margin-top:8px}
.rk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.rk i{grid-column:1/-1;height:6px;border-radius:2px;background:var(--risk);display:block}
.empty{padding:48px 0;text-align:center;color:var(--mu)}
.back{display:inline-block;margin-top:18px;color:var(--mu)}.back:hover{color:var(--tx)}
.ph{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-top:14px}

.sh{display:grid;grid-template-columns:120px 150px 1fr 70px;gap:12px;padding:9px 0;border-bottom:1px solid var(--ln);align-items:center;font-variant-numeric:tabular-nums}

.set{max-width:660px;margin-top:10px}
.set>div{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--ln)}
.set small{display:block;color:var(--mu)}
.ni{display:flex;align-items:center;gap:10px}
#status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--on);margin-right:8px}#status.err::before{background:var(--risk)}#status:empty::before{display:none}
.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.chip{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sf);border:1px solid var(--ln);border-left:3px solid var(--c);border-radius:12px}.chip:hover{border-color:var(--c)}
.chip .av{margin:0;flex:none}.chip>div{min-width:0;flex:1}.chip b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols{display:flex;gap:10px;align-items:flex-end;min-height:190px;min-width:420px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--mu)}
.col b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.stk{width:100%;max-width:48px;display:flex;flex-direction:column-reverse;gap:2px;border-radius:6px;overflow:hidden;min-height:4px}.stk i{display:block;background:var(--c)}
.set>.tgrow{display:block}.tgb{margin-top:14px}.tgs{margin:0 0 14px;padding-left:20px;color:var(--mu)}.tgs b,.tgs code{color:var(--tx)}
.tgf{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.tgf .in{min-width:240px;flex:1}
.tgl{margin:0 0 14px}.tgl a{color:var(--neon);text-decoration:underline}.tgh{font:600 14px Onest,sans-serif;margin:22px 0 4px}
.tgsub{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln)}.tgsub small{display:inline;margin-left:8px}
.tgm{margin:12px 0 0;color:var(--mu)}.tgm.err{color:var(--risk)}
@media(max-width:860px){

aside{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px;z-index:9;border:0;border-top:1px solid var(--ln)}

.two{grid-template-columns:1fr}main{padding-bottom:90px}.bar{position:static}.sh{grid-template-columns:90px 1fr 60px}.sh span:nth-child(2){display:none}
.leg{padding-left:0}.ni{flex-direction:column;gap:3px}nav a{position:relative}.nb{position:absolute;top:2px;right:16%}.tr,.ax{grid-template-columns:110px 1fr}}

}

(function(){

    const t=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/\D/g,'').slice(0,4);
    if(t){e.preventDefault();v='';paint();[...t].forEach(c=>press(c))}
  });
  // ручная блокировка
  async function lockNow(text){
    try{await fetch('/api/logout',{method:'POST'})}catch(e){}
    reset();showLock(text);bc&&bc.postMessage('lock');
  }
  const ln=document.getElementById('lockNow');if(ln)ln.onclick=()=>lockNow();
  // 401 с любой страницы сайта → сразу экран входа
  const _f=window.fetch.bind(window);
  window.fetch=async(...a)=>{
    const r=await _f(...a);
    try{const u=String(a[0]&&a[0].url||a[0]);if(r.status===401&&u.startsWith('/api/')&&!u.startsWith('/api/login')&&!isLocked())showLock('Сессия истекла · введите PIN-код')}catch(e){}
    return r;
  };
  // синхронизация вкладок
  if(bc)bc.onmessage=e=>{if(e.data==='lock'&&!isLocked())showLock();else if(e.data==='unlock'&&isLocked()&&!busy)unlockQuiet()};
  // автоблокировка при бездействии
  const act=()=>{lastAct=Date.now()};
  ['pointerdown','keydown','touchstart','wheel'].forEach(t=>addEventListener(t,act,{passive:true}));
  setInterval(()=>{if(!isLocked()&&Date.now()-lastAct>IDLE)lockNow('Заблокировано из-за бездействия')},30000);
  // проверка сессии на сервере (при открытии и при возврате на вкладку)
  async function check(){
    try{
      const r=await _f('/api/session'),d=await r.json();
      if(d.ok){if(isLocked()&&!busy)unlockQuiet();else ls(KEY,ls(KEY)>Date.now()?ls(KEY):Date.now()+12*36e5)}
      else{if(!isLocked())showLock(); else ls(KEY,null); if(d.retry&&!cd)countdown(d.retry)}
    }catch(e){/* сервер недоступен — оставляем как есть */}
  }
  check();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(Date.now()-lastAct>IDLE&&!isLocked())lockNow('Заблокировано из-за бездействия');else check()}});
})();
</script>
<script>

function conceptOf(p){

  const total=shifts.reduce((t,s)=>t+((s.to||new Date())-s.from),0);

}
function dangerConcept(o){const p=S.staff.find(p=>p.name===o.cashier);return p?conceptOf(p):(guess(o.dept)||'NONE')}

function timeline(P,O){
  const H=20,toEnd=new Date($('#to').value+'T00:00').getTime()+864e5;
  const end=Math.ceil(Math.min(Date.now()+36e5,toEnd)/36e5)*36e5,start=end-H*36e5;
  const x=t=>(Math.min(Math.max(t,start),end)-start)/(end-start)*100;
  const rows=P.filter(p=>p.shifts.some(s=>+(s.to||end)>start&&+s.from<end)).sort((a,b)=>a.concept.localeCompare(b.concept)||a.name.localeCompare(b.name,'ru'));
  if(!rows.length)return '<div class="empty">В этом окне нет смен. Выберите период, который включает сегодня.</div>';
  const ax=Array.from({length:H/2+1},(_,i)=>`<span style="left:${i*2/H*100}%">${pad(new Date(start+i*2*36e5).getHours())}:00</span>`).join('')+(Date.now()<=end?`<span class="nw" style="left:${x(Date.now())}%">сейчас ${tm(new Date())}</span>`:'');
  let g='';
  const mk='position:static;display:inline-block;margin-right:6px;vertical-align:middle;';
  return `<div class="tl"><div class="tl-in" style="--h:${H}"><div class="ax"><div></div><div>${ax}</div></div>
  ${rows.map(p=>{const h=p.concept!==g?(g=p.concept,`<div class="grp c-${g}"><i class="cd"></i>${NAMES[g]}</div>`):'';return h+`<div class="tr c-${p.concept}"><a class="tn" href="/staff/${encodeURIComponent(p.id)}" data-l>${esc(p.name)}<small>${esc(p.role)}</small></a><div class="trk">

    ${O.filter(o=>o.cashier===p.name&&o.severity!=='low'&&+new Date(o.time)>=start&&+new Date(o.time)<=end).map(o=>`<i class="tk ${o.severity}" style="left:${x(+new Date(o.time))}%" title="${tm(new Date(o.time))} — ${esc(o.type)}"></i>`).join('')}
    ${Date.now()<=end?`<i class="now" style="left:${x(Date.now())}%"></i>`:''}</div></div>`}).join('')}
  <div class="leg"><span><i class="sb" style="${mk}width:24px;height:8px;background:var(--mu)"></i>смена (цвет — концепция)</span><span><i class="tk" style="${mk}width:4px;height:14px"></i>высокий риск</span><span><i class="tk mid" style="${mk}width:4px;height:14px"></i>средний риск</span></div></div></div>`;
}

function hoursChart(P){

function askConfirm(title,text,ok,danger){
  return new Promise(res=>{
    const el=document.createElement('div');el.id='dlg';el.setAttribute('role','alertdialog');el.setAttribute('aria-modal','true');
    el.innerHTML=`<div class="dbox"><h4>${esc(title)}</h4>${text?`<p>${esc(text)}</p>`:''}<div class="dbtn"><button class="btn" data-dn0>Отмена</button><button class="btn${danger?' dgr':''}" data-dn1>${esc(ok||'Да')}</button></div></div>`;
    const key=e=>{if(e.key==='Escape'){e.stopImmediatePropagation();e.preventDefault();done(false)}};
    const done=v=>{document.removeEventListener('keydown',key,true);el.remove();res(v)};
    el.addEventListener('click',e=>{e.stopPropagation();if(e.target===el||e.target.closest('[data-dn0]'))done(false);else if(e.target.closest('[data-dn1]'))done(true)});
    document.addEventListener('keydown',key,true);document.body.appendChild(el);

// расчёт за выбранный период: смены из iiko — по дате начала, записи — по своей дате; q — поиск по имени/должности
function payCalc(q){
  const [from,to]=payRange(),P=S.pay,R={};
  const row=(id,name,c,role)=>R[id]||(R[id]={id,name,c,role:role||'',n:0,h:0,open:false,rate:P.rates[id]||null,xn:0,extra:0,bonus:0,fine:0,adv:0,paid:0,list:[]});
  S.staff.map(prep).filter(p=>inScope(p.concept)).forEach(p=>{
    const r=row(p.id,p.name,p.concept,p.role);
    p.shifts.forEach(s=>{const k=iso(s.from);if(k<from||k>to)return;r.n++;r.h+=((s.to||new Date())-s.from)/36e5;if(!s.to)r.open=true});
  });
  P.entries.forEach(e=>{
    if(e.del||e.date<from||e.date>to)return;
    const r=R[e.emp]||(S.scope==='ALL'&&S.br==='ALL'?row(e.emp,e.name||'—','NONE'):null);if(!r)return;
    r.list.push(e);
    if(e.kind==='shift'){r.xn+=e.qty||1;r.extra+=e.amount}
    else if(e.kind==='bonus')r.bonus+=e.amount;else if(e.kind==='fine')r.fine+=e.amount;else if(e.kind==='advance')r.adv+=e.amount;else if(e.kind==='payout')r.paid+=e.amount;
  });
  const s=String(q||'').trim().toLowerCase();
  const rows=Object.values(R).filter(r=>r.n||r.list.length).filter(r=>!s||(r.name+' '+r.role).toLowerCase().includes(s)).map(r=>{
    r.base=r.rate?Math.round(r.rate.type==='hour'?r.h*r.rate.amount:r.n*r.rate.amount):0;
    r.earned=r.base+r.extra+r.bonus-r.fine;r.given=r.adv+r.paid;r.left=r.earned-r.given;return r;
  }).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  const t={earned:0,given:0,left:0,extra:0,bonus:0,fine:0,adv:0,paid:0};
  rows.forEach(r=>{for(const k in t)t[k]+=r[k]});
  return {rows,t,nr:rows.filter(r=>!r.rate&&r.n).length};
}

function branches(){
  const set=new Set();S.staff.forEach(p=>p.shifts.forEach(s=>s.dept&&set.add(s.dept)));S.danger.forEach(o=>o.dept&&set.add(o.dept));
  return [...set].filter(d=>S.scope==='ALL'||guess(d)===S.scope).sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));
}
function drawBranches(){
  const l=branches(),el=$('#brs');

function cardify(){
  document.querySelectorAll('#view table').forEach(t=>{

    t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((td,i)=>{

function setStatus(t,err){const e=$('#status');e.textContent=t;e.className=err?'err':''}
async function load(silent){
  if(silent&&S.inflight)return;
  S.demo=false;setStatus('Загружаю данные из iiko…');
  if(S.preset!=null)setPreset(S.preset);
  const from=$('#from').value,last=$('#to').value;
  if(!from||!last||from>last){setStatus('Выберите период: дата «с» не может быть позже даты «по».',true);return}
  const to=new Date(new Date(last).getTime()+864e5).toISOString().slice(0,10);
  // iiko считает «сутки» по бизнес-дате: ночные заказы (после полуночи) лежат под вчерашним днём.
  // Поэтому просим на день больше и отбираем по реальному времени операции/смены.
  const pd=new Date(from+'T00:00:00');pd.setDate(pd.getDate()-1);const pf=iso(pd);
  const t0=new Date(from+'T00:00:00').getTime(),t1=new Date(last+'T00:00:00').getTime()+864e5;
  const inDay=t=>{const k=String(t||'').slice(0,10);return k>=from&&k<=last};
  const inShift=x=>{const a=Date.parse(x.from),b=x.to?Date.parse(x.to):Infinity;return isNaN(a)||(a<t1&&b>=t0)};
  const get=async u=>{const ac=new AbortController(),tmo=setTimeout(()=>ac.abort(),90000);
    try{const r=await fetch(`${u}?from=${pf}&to=${to}`,{signal:ac.signal});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
    catch(e){throw e.name==='AbortError'?new Error('iiko отвечает слишком долго (больше 90 секунд)'):e}finally{clearTimeout(tmo)}};
  S.inflight=true;
  loadPay();
  const my=S.lid=(S.lid||0)+1,done=()=>{if(my!==S.lid)return false;S.inflight=false;S.loading=false;$('#reload').classList.remove('spin');return true};
  S.loading=!silent;$('#reload').classList.add('spin');if(S.loading)render();
  try{
    const st=await get('/api/staff');if(my!==S.lid)return;S.staff=st.map(p=>({...p,shifts:p.shifts.filter(inShift)})).filter(p=>p.shifts.length);
    try{const j=await get('/api/danger');if(my!==S.lid)return;S.stats=j.stats||null;S.rawN=j.ops.length;S.danger=j.ops.filter(o=>inDay(o.time));S.note=j.note;S.marks=j.marks||{}}
    catch(e){if(!done())return;S.danger=[];setStatus('Сотрудники загружены, но операции не получены: '+e.message,true);render();return}
    const lo=S.danger[0]&&String(S.danger[0].time),lt=lo?' · последняя операция '+lo.slice(8,10)+'.'+lo.slice(5,7)+' '+lo.slice(11,16):'';
    setStatus('Данные iiko, обновлено '+tm(new Date())+lt+(S.note?'. '+S.note:''),!!S.note);
  }catch(e){if(!done())return;setStatus('Не удалось получить данные: '+e.message+'. Проверьте, что server.js запущен.',true);S.staff=[];S.danger=[]}
  if(!done())return;
  render();
}
function demo(){
  const names=[['Азиз Каримов','Официант'],['Дильноза Рашидова','Бармен'],['Жасур Тошматов','Повар'],['Нигора Юсупова','Администратор'],['Бекзод Алиев','Официант'],['Мадина Хасанова','Хостес'],['Рустам Саидов','Кассир'],['Лола Эргашева','Официант'],['Тимур Назаров','Бармен'],['Сардор Умаров','Повар']];
  const depts=['NEON Ташкент','OLOV Ташкент'];let r=7;const rnd=()=>(r=r*16807%2147483647)/2147483647;
  S.staff=names.map((n,i)=>{const dept=i===9?'Главный офис':depts[i%2],shifts=[];
    for(let d=0;d<10;d++){if(rnd()<.35)continue;const f=new Date();f.setDate(f.getDate()-d);f.setHours(13+Math.floor(rnd()*4),Math.floor(rnd()*60),0,0);
      const t=new Date(f.getTime()+(7+rnd()*5)*36e5);shifts.push({from:f.toISOString(),to:(d===0&&i<3)?null:t.toISOString(),dept})}
    return {id:'d'+i,name:n[0],role:n[1],shifts:shifts.length?shifts:[{from:new Date(Date.now()-864e5).toISOString(),to:new Date().toISOString(),dept}]}});
  const types=[['Удалённый заказ','high'],['Удаление со списанием','high'],['Удаление без списания','high'],['Сторно','high'],['Скидка от 30%','mid'],['Удаление','low']];
  S.danger=Array.from({length:14},(_,i)=>{const p=names[Math.floor(rnd()*names.length)],t=types[Math.floor(rnd()*types.length)],sum=(50+Math.floor(rnd()*400))*1000;
    return {id:'demo'+i,time:new Date(Date.now()-rnd()*10*864e5).toISOString(),order:1000+i*7,table:String(1+Math.floor(rnd()*20)),dish:['Лимонад','Бургер','Кофе','Паста'][Math.floor(rnd()*4)],qty:1,reg:String(1+Math.floor(rnd()*3)),cashier:p[0],auth:'Администратор',dept:'',sum,discount:t[1]==='mid'?sum*.35:0,type:t[0],severity:t[1]}})
    .sort((a,b)=>b.time.localeCompare(a.time));
  S.lid=(S.lid||0)+1;S.inflight=false;S.loading=false;$('#reload').classList.remove('spin');S.demo=true;setStatus('Показаны демо-данные, не из iiko');render();
}

<script>
(function(){

    try{tg.BackButton.onClick(back)}catch(e){}
    const upd=()=>{try{(route()[0]==='overview'||root.classList.contains('is-locked'))?tg.BackButton.hide():tg.BackButton.show()}catch(e){}};
    if(typeof window.render==='function'){const _r=window.render;window.render=function(){const x=_r.apply(this,arguments);upd();return x}}
    new MutationObserver(upd).observe(root,{attributes:true,attributeFilter:['class']});
    upd();
    // тактильный отклик
    const H=tg.HapticFeedback||{};
    document.addEventListener('click',e=>{
      if(root.classList.contains('is-locked')||e.target.closest('.lk-k'))return;
      try{
        if(e.target.closest('.seg button,.ftc button,[data-th],[data-fs]'))H.selectionChanged&&H.selectionChanged();
        else if(e.target.closest('button,nav a,[data-go],tr[data-ord],tr.lk,.chip,summary'))H.impactOccurred&&H.impactOccurred('light');
      }catch(_){}
    },true);
    // переключатель «Во весь экран»
    document.addEventListener('click',e=>{const b=e.target.closest('[data-fs]');if(!b)return;ls2('tgfs',b.dataset.fs);fs();if(typeof render==='function')render()});
    // подтверждения: уведомление при ошибке/успехе отметки не нужно — только тап
  }
})();
// ===== жесты для телефона (работают и в браузере, и в Telegram) =====
(function(){
  if(!(matchMedia&&matchMedia('(pointer:coarse)').matches))return;
  const root=document.documentElement,ptr=document.getElementById('ptr'),sheet=document.getElementById('sheet');
  const hap=t=>{try{const h=Telegram.WebApp.HapticFeedback;t==='ok'?h.notificationOccurred('success'):h.impactOccurred('light')}catch(e){}};
  // потянуть вниз = обновить
  let sy=0,dy=0,on=false,armed=false;
  const draw=(d,anim)=>{ptr.style.transition=anim?'opacity .2s,transform .25s':'none';ptr.style.opacity=d>6?Math.min(1,d/50):0;ptr.style.transform='translateY('+(d>0?d-48:-60)+'px)';ptr.firstElementChild.style.transform='rotate('+d*4+'deg)'};
  addEventListener('touchstart',e=>{
    if(window.scrollY>0||!sheet.hidden||root.classList.contains('is-locked')||e.touches.length>1||e.target.closest('input,select,.wrap,.tl,#presets,.ftc'))return;
    sy=e.touches[0].clientY;dy=0;on=true;armed=false;
  },{passive:true});
  addEventListener('touchmove',e=>{
    if(!on)return;const d=e.touches[0].clientY-sy;
    if(window.scrollY>0||d<=0){if(d<=0)draw(0);return}
    dy=Math.min(d*.5,84);draw(dy);
    if(dy>=60&&!armed){armed=true;hap('l')}else if(dy<60)armed=false;
  },{passive:true});
  addEventListener('touchend',()=>{
    if(!on)return;on=false;
    if(dy>=60){
      ptr.classList.add('spin');draw(52,true);
      Promise.resolve(S.demo?demo():load()).finally(()=>setTimeout(()=>{ptr.classList.remove('spin');draw(0,true)},350));
    }else draw(0,true);
    dy=0;
  },{passive:true});
  // карточку заказа можно смахнуть вниз
  let bx=0,bd=0,box=null;
  sheet.addEventListener('touchstart',e=>{box=e.target.closest('.box');if(!box||box.scrollTop>0){box=null;return}bx=e.touches[0].clientY;bd=0},{passive:true});
  sheet.addEventListener('touchmove',e=>{if(!box)return;bd=e.touches[0].clientY-bx;if(bd>0){box.style.transition='none';box.style.transform='translateY('+bd+'px)'}},{passive:true});
  sheet.addEventListener('touchend',()=>{
    if(!box)return;const b=box;box=null;b.style.transition='transform .22s ease';
    if(bd>110){b.style.transform='translateY(100%)';setTimeout(()=>{sheet.hidden=true;b.style.transform='';b.style.transition=''},200);hap('l')}
    else{b.style.transform='';setTimeout(()=>{b.style.transition=''},230)}
    bd=0;
  },{passive:true});
})();
</script>
